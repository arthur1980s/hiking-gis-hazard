# TrailSense nginx 站点配置 (VPS: 173.242.116.220)
# 部署位置: /etc/nginx/sites-available/trailsense → sites-enabled
# 站点根: /var/www/html/trailsense
# 域名: www.goitex.com / goitex.com (用户 DNS 绑定后生效)
server {
    listen 80;
    listen [::]:80;
    server_name www.goitex.com goitex.com 173.242.116.220;

    root /var/www/html/trailsense;
    index index.html;

    # 兼容旧路径 /trailsense/ → 根路径
    location = /trailsense { return 301 /; }
    location = /trailsense/ { return 301 /; }

    # PWA manifest 与 service worker 不缓存
    location = /manifest.json { add_header Cache-Control 'no-cache'; }
    location = /sw.js {
        add_header Cache-Control 'no-cache';
        add_header Service-Worker-Allowed /;
    }

    # 主应用: SPA fallback
    location / { try_files $uri $uri/ /index.html; }

    # 静态资源 7 天长缓存
    location ~* \.(js|css|svg|png|jpg|ico|webmanifest)$ {
        expires 7d;
        add_header Cache-Control 'public';
    }
}
