# ── CSP: 脚本/样式/图片/连接 白名单(2026-08-15) ──
# script: 自源 + jsdelivr/unpkg/cdnjs(CDN 降级) + 内联 CDN 检查脚本
# img:    OpenTopoMap/Esri/CartoDB 底图 + NASA GIBS 山火瓦片 + RainViewer 雨带
# connect: USGS 地震 / Open-Meteo 气象 / RainViewer / NASA FIRMS+GIBS
map $http_host $csp_host {
    default "https://www.goitex.com";
}

server {
    listen 80;
    listen [::]:80;
    server_name www.goitex.com goitex.com 173.242.116.220;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.goitex.com goitex.com 173.242.116.220;

    ssl_certificate     /etc/letsencrypt/live/goitex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goitex.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/trailsense;
    index index.html;

    set $csp "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.opentopomap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com https://gibs.earthdata.nasa.gov https://tilecache.rainviewer.com; connect-src 'self' https://earthquake.usgs.gov https://api.open-meteo.com https://api.rainviewer.com https://firms.modaps.eosdis.nasa.gov https://gibs.earthdata.nasa.gov; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed /;
        add_header Content-Security-Policy $csp always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy $csp always;
    }
    location ~* \.(js|css|svg|png|jpg|ico|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Content-Security-Policy $csp always;
    }
}
