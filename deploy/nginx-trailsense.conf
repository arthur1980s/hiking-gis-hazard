server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name www.goitex.com goitex.com 173.242.116.220;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.goitex.com goitex.com 173.242.116.220;

    ssl_certificate     /etc/letsencrypt/live/goitex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goitex.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/trailsense;
    index index.html;

    set $csp "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.opentopomap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com https://gibs.earthdata.nasa.gov https://tilecache.rainviewer.com https://s3.amazonaws.com https://webrd01.is.autonavi.com https://webst01.is.autonavi.com https://tile.openstreetmap.org; connect-src 'self' https://earthquake.usgs.gov https://api.open-meteo.com https://api.rainviewer.com https://firms.modaps.eosdis.nasa.gov https://gibs.earthdata.nasa.gov https://a.tile.opentopomap.org https://server.arcgisonline.com https://webrd01.is.autonavi.com https://webst01.is.autonavi.com https://tile.openstreetmap.org; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";

    # HTML 不缓存: 每次回源拿最新(配合资源 ?v= 版本号)
    location ~* \.(html|htm)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed /;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    # 带版本号的静态资源(如 ?v=8): 长缓存合理(URL 变了才重新拉)
    location ~* \.(js|css|svg|png|jpg|ico|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
